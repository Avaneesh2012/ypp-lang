name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ypp
            asset_name: ypp-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ypp.exe
            asset_name: ypp-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ypp
            asset_name: ypp-macos-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary for upload
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/ypp.exe" "dist/ypp-windows-amd64.exe"
            cp "target/${{ matrix.target }}/release/ypp-ide.exe" "dist/ypp-ide-windows-amd64.exe"
          else
            cp "target/${{ matrix.target }}/release/ypp" "dist/ypp-${{ matrix.os }}-amd64"
            cp "target/${{ matrix.target }}/release/ypp-ide" "dist/ypp-ide-${{ matrix.os }}-amd64"
            chmod +x "dist/ypp-${{ matrix.os }}-amd64"
            chmod +x "dist/ypp-ide-${{ matrix.os }}-amd64"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-bins
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Clean up old releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/Avaneesh2012/ypp-lang/releases")
          echo "$RELEASES" | jq -r '.[] | select(.tag_name != "v1.2.1") | .id' | while read -r rel_id; do
            if [ -n "$rel_id" ]; then
              echo "Deleting old release ID: $rel_id"
              curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/Avaneesh2012/ypp-lang/releases/$rel_id"
            fi
          done

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: "Y++ v1.2.1"
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Release Title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/Avaneesh2012/ypp-lang/releases/tags/v1.2.1" | jq -r '.id')
          if [ -n "$REL_ID" ] && [ "$REL_ID" != "null" ]; then
            curl -s -X PATCH -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/Avaneesh2012/ypp-lang/releases/$REL_ID" \
              -d '{"name":"Y++ v1.2.1"}'
          fi
