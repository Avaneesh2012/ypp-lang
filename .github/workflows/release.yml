name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build release binaries
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ypp
            asset_name: ypp-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ypp.exe
            asset_name: ypp-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ypp
            asset_name: ypp-macos-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/ypp-linux-amd64/ypp-linux-amd64
            artifacts/ypp-windows-amd64.exe/ypp-windows-amd64.exe
            artifacts/ypp-macos-amd64/ypp-macos-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
