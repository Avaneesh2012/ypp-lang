[package]
name = "ypp"
version = "2.0.0"
edition = "2021"
description = "Y++ Programming Language Interpreter & IDE"
authors = ["Avaneesh"]

[dependencies]
minifb = "0.28"
eframe = { version = "0.29", features = ["default"] }
egui = "0.29"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
native-windows-derive = "1.0.5"
native-windows-gui = "1.0.13"

[profile.release]
opt-level = 3
lto = true
strip = true

[[bin]]
name = "ypp"
path = "src/main.rs"

[[bin]]
name = "ypp-ide"
path = "src/ide.rs"

[[bin]]
name = "ypp-ide2"
path = "src/ide2.rs"
