[package]
name = "ypp"
version = "1.2.0"
edition = "2021"
description = "Y++ Programming Language Interpreter"
authors = ["Avaneesh"]

[dependencies]
minifb = "0.28"
native-windows-derive = "1.0.5"
native-windows-gui = "1.0.13"

[profile.release]
opt-level = 3
lto = true
strip = true

[[bin]]
name = "ypp"
path = "src/main.rs"

[[bin]]
name = "ypp-ide"
path = "src/ide.rs"

